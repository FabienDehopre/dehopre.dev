name: Weekly rebuild

# Rebuilds the site on Netlify so Project data fetched from GitHub at build time stays fresh (see docs/adr/0001).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::The NETLIFY_BUILD_HOOK_URL secret is not set."
            exit 1
          fi
          curl --silent --show-error --fail-with-body --request POST --data '{}' "$NETLIFY_BUILD_HOOK_URL"
